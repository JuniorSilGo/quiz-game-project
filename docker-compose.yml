version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: quiz_postgres
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_db
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    networks: [ quiz-net ]

  auth-service:
    build: ./auth-service
    container_name: auth_service
    env_file: ./auth-service/.env
    depends_on: [ postgres ]
    ports: [ "3001:3001", "50051:50051" ]
    networks: [ quiz-net ]

  gateway:
    build: ./gateway
    container_name: gateway
    env_file: ./gateway/.env
    depends_on: [ auth-service ]
    ports: [ "3000:3000", "50050:50050" ]
    networks: [ quiz-net ]

  question-service:
    build: ./question-service
    container_name: question_service
    env_file: ./question-service/.env
    depends_on: [ postgres, gateway ]
    ports: [ "3003:3003", "50054:50054" ]
    networks: [ quiz-net ]

#  match-engine:
#    build: ./match-engine
#    container_name: match-engine
#    depends_on: [ gateway ]
#    ports: [ "3002:3002", "50052:50052" ]
#    networks: [ quiz-net ]

  kong:
    image: kong:3.8
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - auth-service
      - match-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      JWT_SECRET: MEU_SUPER_SECRET
      JWT_ISSUER: auth-service
      HTTP_PORT: 3001
    ports:
      - "3001:3001"
    expose:
      - "50051"

  match-service:
    build:
      context: ./match-service
      dockerfile: Dockerfile
    container_name: match-service
    expose:
      - "50051"
