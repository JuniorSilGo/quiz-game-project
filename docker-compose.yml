version: "3.9"

services:
  kong:
    image: kong:3.8
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - auth-service
      - match-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      JWT_SECRET: MEU_SUPER_SECRET
      JWT_ISSUER: auth-service
      HTTP_PORT: 3001
    ports:
      - "3001:3001"
    expose:
      - "50051"

  match-service:
    build:
      context: ./match-service
      dockerfile: Dockerfile
    container_name: match-service
    expose:
      - "50051"
