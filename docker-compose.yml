services:
  postgres:
    image: postgres:15
    container_name: quiz_postgres
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_db
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    networks: [ quiz-net ]

  auth-service:
    build: ./auth-service
    container_name: auth_service
    env_file: ./auth-service/.env
    depends_on: [ postgres ]
    ports: [ "3001:3001", "50056:50056" ]
    networks: [ quiz-net ]

  gateway:
    build: ./gateway
    container_name: gateway
    env_file: ./gateway/.env
    depends_on: [ auth-service ]
    ports: [ "3000:3000", "50050:50050" ]
    networks: [ quiz-net ]

  statistics:
      build: ./statistics
      container_name: statistics
      env_file: ./statistics/.env
      environment: [AUTH_SERVICE_ADDR=auth-service:50056, STATISTICS_BIND_ADDR=0.0.0.0:50050]
      depends_on: [auth-service]
      ports: ["3002:3002"]
      networks: [ quiz-net ]

#  match-engine:
#    build: ./match-engine
#    container_name: match-engine
#    depends_on: [ gateway ]
#    ports: [ "3002:3002", "50052:50052" ]
#    networks: [ quiz-net ]

  kong:
    image: kong:3.5
    container_name: kong
    depends_on: [ gateway ]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_LOG_LEVEL: notice
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "8000:8000"   # Proxy HTTP (cliente → Kong)
      - "8001:8001"   # Admin API HTTP
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    networks: [ quiz-net ]

volumes:
  pgdata:

networks:
  quiz-net:
