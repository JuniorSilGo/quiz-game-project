services:
  # ═══════════════════════════════════════════════════════════════════
  # INFRAESTRUTURA
  # ═══════════════════════════════════════════════════════════════════
  
  postgres:
    image: postgres:15
    container_name: quiz_postgres
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quiz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: quiz_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: quiz_user
      RABBITMQ_DEFAULT_PASS: quiz_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quiz-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════
  # MICROSERVIÇOS
  # ═══════════════════════════════════════════════════════════════════

  auth-service:
    build: ./auth-service
    container_name: auth_service
    environment:
      NODE_ENV: production
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://quiz_user:quiz_password@postgres:5432/quiz_db?schema=auth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    networks:
      - quiz-net
    restart: unless-stopped

  question-service:
    build: ./question-service
    container_name: question_service
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://quiz_user:quiz_password@rabbitmq:5672
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-mistralai/mistral-7b-instruct}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "50054:50054"
    networks:
      - quiz-net
    restart: unless-stopped

  room-service:
    build: ./room-service
    container_name: room_service
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://quiz_user:quiz_password@postgres:5432/quiz_db?schema=room
      ROOM_GRPC_URL: 0.0.0.0:50052
      AUTH_GRPC_URL: auth-service:50051
      QUESTION_GRPC_URL: question-service:50054
      MATCH_GRPC_URL: match-service:50053
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "3000:3000"   # HTTP/GraphQL
      - "50052:50052" # gRPC
    networks:
      - quiz-net
    restart: unless-stopped

  match-service:
    build: ./match-service
    container_name: match_service
    environment:
      NODE_ENV: production
      GRPC_PORT: 50053
      AUTH_GRPC_URL: auth-service:50051
      QUESTION_GRPC_URL: question-service:50054
      ROOM_GRPC_URL: room-service:50052
    depends_on:
      - auth-service
      - question-service
    ports:
      - "50053:50053"
    networks:
      - quiz-net
    restart: unless-stopped

  statistics-service:
    build: ./statistics
    container_name: statistics_service
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quiz_user:quiz_password@postgres:5432/quiz_db?schema=statistics
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50050:50050"
    networks:
      - quiz-net
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:

networks:
  quiz-net:
    driver: bridge
