version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: quiz_postgres
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quiz-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: quiz_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: quiz_user
      RABBITMQ_DEFAULT_PASS: quiz_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quiz-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: auth_service
    env_file: ./auth-service/.env
    depends_on:
      - postgres
    ports:
      - "3001:3001"
      - "50051:50051"
    networks:
      - quiz-net

  question-service:
    build: ./question-service
    container_name: question_service
    env_file: ./question-service/.env
    environment:
      RABBITMQ_URL: amqp://quiz_user:quiz_password@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "50053:50053"
    networks:
      - quiz-net

volumes:
  pgdata:
  rabbitmq_data:

networks:
  quiz-net:
    driver: bridge
