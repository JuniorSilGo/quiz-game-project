syntax = "proto3";

package player;

message Player {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  int32 level = 5;
  int64 xp = 6;
  int32 wins = 7;
  int32 matches_played = 8;
  string created_at = 9;
  string updated_at = 10;
}

message GetPlayerByIdRequest {
  int32 id = 1;
}

message GetPlayerByUsernameRequest {
  string username = 1;
}

message CreatePlayerRequest {
  string username = 1;
  string email = 2;
  string avatar = 3;
}

message UpdatePlayerRequest {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  int32 level = 5;
  int64 xp = 6;
  int32 wins = 7;
  int32 matches_played = 8;
}

message DeletePlayerRequest {
  int32 id = 1;
}

message PlayerResponse {
  Player player = 1;
}

message PlayersResponse {
  repeated Player players = 1;
}

message DeletePlayerResponse {
  bool success = 1;
}

service PlayerService {
  rpc GetPlayerById(GetPlayerByIdRequest) returns (PlayerResponse);
  rpc GetPlayerByUsername(GetPlayerByUsernameRequest) returns (PlayerResponse);
  rpc CreatePlayer(CreatePlayerRequest) returns (PlayerResponse);
  rpc UpdatePlayer(UpdatePlayerRequest) returns (PlayerResponse);
  rpc DeletePlayer(DeletePlayerRequest) returns (DeletePlayerResponse);
}
