syntax = "proto3";

package auth;

service AuthService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

service UserService {
  rpc GetUser     (GetUserRequest)     returns (User);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool   valid = 1;
  string userId = 2;
  string username = 3;
  string email = 4;
  string reason = 5;
}

message GetUserRequest {
  int32 userId = 1;
}

message User {
  int32  id = 1;
  string username = 2;
  string email = 3;
  string createdAt = 6;
  string updatedAt = 7;
}