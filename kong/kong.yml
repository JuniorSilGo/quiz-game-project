_format_version: "3.0"
_transform: true

services:
  - name: gateway-service
    url: http://gateway:3000
    routes:
      - name: gateway-route
        paths:
          - /api
        strip_path: true

    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          fault_tolerant: true
          limit_by: ip