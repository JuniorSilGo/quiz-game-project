syntax = "proto3";

package statistics;

service StatisticsService {
  rpc GetUserStats (GetUserStatusRequest) returns (UserStatsResponse);
  rpc GetRanking (EmptyRequest) returns (RankingResponse);
  rpc UpdateStats (UpdateStatsRequest) returns (UserStatsResponse);
}

message EmptyRequest {}

message GetUserStatusRequest {
  int32 userId = 1;
}

message UpdateStatsRequest {
  int32 userId = 1;
  int32 scoreToAdd = 2;
  bool won = 3;
}

message UserStatsResponse {
  int32 userId = 1;
  int64 score = 2;
  int64 wins = 3;
  int64 matches = 4;
}

message RankingResponse {
  repeated UserStatsResponse users = 1;
}
