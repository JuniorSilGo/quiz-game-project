syntax = "proto3";
package auth;

service AuthService {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

service UserService {
  rpc RecordMatch (RecordMatchRequest) returns (UserActionResponse);
  rpc GetUser     (GetUserRequest)     returns (User);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool   valid = 1;
  string userId = 2;
  string username = 3;
  string email = 4;
  string reason = 5;
}

message RecordMatchRequest {
  int32 userId = 1;
  bool  didWin = 2;
}

message GetUserRequest { int32 userId = 1; }

message UserActionResponse {
  bool   success = 1;
  int32  userId = 2;
  string username = 3;
  int32  wins = 4;
  int32  matchesPlayed = 5;
  string updatedAt = 6;
}

message User {
  int32  id             = 1;
  string username       = 2;
  string email          = 3;
  int32  wins           = 4;
  int32  matchesPlayed  = 5;
  string createdAt      = 6;
  string updatedAt      = 7;
}